# SAPHAL OS Security Posture & Capability Configuration
# Enforces least privilege across system daemons

[policy]
mode = enforcing
telemetry = disabled
selinux = enforcing

[mounts]
harden_tmp = nosuid,nodev,noexec
harden_run = nosuid,nodev,noexec
harden_proc = nosuid,nodev,noexec
harden_sys = nosuid,nodev,noexec

[partitions]
protect_radio = nvram,nvdata,protect_f,protect_s
protect_bootloader = boot0,boot1,preloader
read_only_root = true

[userspace]
init_process = /init
supervisor_daemon = /bin/saphal-secd
ui_engine = /bin/saphal-splash
default_shell = /bin/saphal-sh
